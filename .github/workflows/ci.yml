name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.compiler.name }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc-13, cc: gcc-13, cxx: g++-13, packages: "g++-13" }
          - { name: clang-18, cc: clang-18, cxx: clang++-18, packages: "clang-18" }
        preset: [dev, release]
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build ${{ matrix.compiler.packages }}

      - name: Show tool versions
        run: |
          cmake --version
          ninja --version
          "$CXX" --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  versions:
    name: Version and changelog
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history and tags: the version gate diffs against the base branch.
          fetch-depth: 0

      - name: Validate VERSION and CHANGELOG.md
        run: python3 tools/release.py validate

      - name: Require a version bump when shipped files change
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 tools/release.py check-versions --base "origin/${BASE_REF}"

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Check formatting
        run: |
          find include src tests -type f \( -name '*.hpp' -o -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 --no-run-if-empty clang-format-18 --dry-run --Werror
